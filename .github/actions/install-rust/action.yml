name: Install pinned Rust tools
description: Install and verify the repository compiler and optional test runner

inputs:
  components:
    description: Extra toolchain components
    default: ""
  nextest:
    description: Install cargo-nextest
    default: "false"

outputs:
  rust-version:
    description: Exact compiler release
    value: ${{ steps.pins.outputs.rust-version }}
  nextest-version:
    description: Exact nextest release
    value: ${{ steps.pins.outputs.nextest-version }}

runs:
  using: composite
  steps:
    - name: Read repository tool pins
      id: pins
      shell: pwsh
      run: .github/scripts/check-build-tools.ps1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: ${{ steps.pins.outputs.rust-version }}
        components: ${{ inputs.components }}
    - name: Install cargo-nextest
      if: inputs.nextest == 'true'
      uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      with:
        tool: nextest@${{ steps.pins.outputs.nextest-version }}
    - name: Verify compiler and test-runner releases
      shell: pwsh
      env:
        INSTALL_NEXTEST: ${{ inputs.nextest }}
      run: .github/scripts/check-build-tools.ps1 -Verify -Nextest:($env:INSTALL_NEXTEST -eq 'true')
