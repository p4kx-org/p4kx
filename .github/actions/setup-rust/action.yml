name: Set up Rust
description: Shared native build setup, run after checkout

inputs:
  cache-key:
    description: Distinct rust-cache key per job type
    required: true
  target:
    description: Native Rust target from the platform contract
    default: ""
  components:
    description: Extra toolchain components
    default: ""
  nextest:
    description: Install cargo-nextest
    default: "false"
  cache-on-failure:
    description: Retain dependency builds when a later job step fails
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-rust
      id: toolchain
      with:
        target: ${{ inputs.target }}
        components: ${{ inputs.components }}
        nextest: ${{ inputs.nextest }}
    - name: Link with rust-lld on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        NATIVE_TARGET: ${{ steps.toolchain.outputs.target }}
      run: .github/scripts/check-build-tools.ps1 -Target $env:NATIVE_TARGET -SelectEnvironment linker
    - name: Link with native mold on Linux
      if: runner.os == 'Linux'
      uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
    - name: Select mold as the Linux linker
      if: runner.os == 'Linux'
      shell: pwsh
      env:
        NATIVE_TARGET: ${{ steps.toolchain.outputs.target }}
      run: .github/scripts/check-build-tools.ps1 -Target $env:NATIVE_TARGET -SelectEnvironment linker
    - name: Mount a ReFS Dev Drive as the Windows AMD64 target directory
      if: runner.os == 'Windows' && runner.arch == 'X64'
      uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
      with:
        drive-size: 60GB
        mount-path: target
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}-${{ steps.toolchain.outputs.cache-platform }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
    - name: Install the native ALSA headers
      if: runner.os == 'Linux'
      shell: pwsh
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
