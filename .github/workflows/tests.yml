name: Tests

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      target:
        type: string
        required: true
      partitions:
        type: string
        required: true
      count:
        type: number
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci
  P4KX_TARGET: ${{ inputs.target }}

jobs:
  build-tests:
    name: Build tests (${{ inputs.target }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.target == 'aarch64-apple-darwin' && 135 || 90 }}
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
          target: ${{ inputs.target }}
          nextest: "true"
      - name: Build all native applications
        shell: pwsh
        run: cargo build --locked --target $env:P4KX_TARGET -p p4kx -p p4kx-gui -p p4kx-mcp
      - name: Build every native test binary once and archive them
        shell: pwsh
        run: cargo nextest archive --workspace --locked --target $env:P4KX_TARGET --archive-file nextest-archive.tar.zst
      - name: Inspect application machine types and identify the test archive
        shell: pwsh
        run: .github/scripts/check-native-platform.ps1 -Target $env:P4KX_TARGET -BinaryDirectory "target/$env:P4KX_TARGET/debug" -ArchivePath nextest-archive.tar.zst -MetadataPath nextest-archive.json
      - name: Test the opt-in MSI fixture without Registry access
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo nextest run --locked --target $env:P4KX_TARGET -p p4kx-msi-path --lib --features native-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Pure MSI fixture library tests failed.' }
          cargo test --locked --target $env:P4KX_TARGET -p p4kx-msi-path --example p4kx-msi-registry-fixture --features native-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Pure MSI fixture codec tests failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-${{ inputs.target }}-${{ github.sha }}
          path: |
            nextest-archive.tar.zst
            nextest-archive.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /
      - name: Execute the complete Apple Silicon test suite
        if: inputs.target == 'aarch64-apple-darwin'
        uses: ./.github/actions/test-native-archive
        with:
          partition: '1'
          partition-count: ${{ inputs.count }}

  test:
    if: inputs.target != 'aarch64-apple-darwin'
    name: Test (${{ inputs.target }} ${{ matrix.partition }}/${{ inputs.count }})
    needs: build-tests
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
        with:
          target: ${{ inputs.target }}
          nextest: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive-${{ inputs.target }}-${{ github.sha }}
      - name: Execute the native test partition
        uses: ./.github/actions/test-native-archive
        with:
          partition: ${{ matrix.partition }}
          partition-count: ${{ inputs.count }}
