name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/*release*.yml"
      - ".github/actions/**"
      - "rust-toolchain.toml"
      - ".config/**"
      - ".github/scripts/**"
      - "crates/p4kx-gui/wix/**"
      - "crates/p4kx-gui/assets/p4kx.ico"
      - "crates/p4kx-gui/build.rs"
      - "crates/p4kx/build.rs"
      - "crates/p4kx-testkit/examples/native_fixture.rs"
      - "packaging/linux/**"
      - "blender_addon/**"
  workflow_dispatch:
    inputs:
      linux-only:
        description: Validate native Linux packages without Windows, external scans or publication
        type: boolean
        default: false
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Release identity and package plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      msi-version: ${{ steps.version.outputs.msi-version }}
      next-msi-version: ${{ steps.version.outputs.next-msi-version }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      windows-matrix: ${{ steps.platforms.outputs.windows-matrix }}
      linux-matrix: ${{ steps.platforms.outputs.linux-matrix }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      - name: Read the authoritative native platform plan
        id: platforms
        run: |
          $all = .github/scripts/read-platform-matrix.ps1
          $windows = .github/scripts/read-platform-matrix.ps1 -Os windows
          $linux = .github/scripts/read-platform-matrix.ps1 -Os linux
          "matrix=$all" >> $env:GITHUB_OUTPUT
          "windows-matrix=$windows" >> $env:GITHUB_OUTPUT
          "linux-matrix=$linux" >> $env:GITHUB_OUTPUT
      - name: Version and tag identity
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release version query failed.' }
          $versions = @($metadata.packages | Where-Object name -CIn @('p4kx', 'p4kx-gui', 'p4kx-mcp') | Select-Object -ExpandProperty version -Unique)
          if ($versions.Count -ne 1) { throw 'Shipped application versions differ.' }
          $version = $versions[0]
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $tag) { throw 'Release tag and application version differ.' }
          $core = [version]($version -replace '[-+].*$', '')
          if ($core.Major -gt 255 -or $core.Minor -gt 255 -or $core.Build -ge 65535) { throw 'Version cannot be represented by the MSI upgrade test.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "msi-version=$core" >> $env:GITHUB_OUTPUT
          "next-msi-version=$($core.Major).$($core.Minor).$($core.Build + 1)" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force target/package | Out-Null
          cargo xtask release-notes $tag target/package/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed.' }
      - name: Check Blender add-on release identity
        run: cargo xtask addon
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build architecture-neutral Blender add-on
        run: python blender_addon/build_zip.py target/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-addon
          path: target/package/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-notes
          path: target/package/release-notes.md
          if-no-files-found: error

  windows:
    name: Native Windows packages
    if: github.event_name != 'workflow_dispatch' || !inputs.linux-only
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      msi-version: ${{ needs.prepare.outputs.msi-version }}
      next-msi-version: ${{ needs.prepare.outputs.next-msi-version }}
      matrix: ${{ needs.prepare.outputs.windows-matrix }}

  linux:
    name: Linux native packages and execution
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/release-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      matrix: ${{ needs.prepare.outputs.linux-matrix }}

  scan:
    name: VirusTotal scan of package assets
    needs: [prepare, windows, linux]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && !inputs.linux-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Scan every present architecture-specific package
        continue-on-error: true
        timeout-minutes: 140
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          . .github/scripts/platform-contract.ps1
          $contract = Get-P4kxPlatformContract
          $files = @(foreach ($row in $contract.targets) {
            foreach ($package in $row.packages) {
              $name = Get-P4kxAssetName -Target $row.target -Version $env:VERSION -Package $package
              (Get-Item -LiteralPath "assets/$name").FullName
            }
          })
          .github/scripts/virustotal-scan.ps1 -Path $files -NotePath virustotal.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal-note
          path: virustotal.md
          if-no-files-found: ignore

  attest:
    name: Attest (${{ matrix.target }})
    needs: [prepare, windows, linux]
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-attest.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      target: ${{ matrix.target }}

  attest-addon:
    name: Attest architecture-neutral add-on
    needs: prepare
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-addon
          path: assets
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: assets/*.zip
      - name: Name add-on provenance
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory bundles | Out-Null
          Copy-Item -LiteralPath $env:BUNDLE -Destination "bundles/P4KX-$env:VERSION-addon-provenance.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestations-addon
          path: bundles/*.sigstore.json
          if-no-files-found: error

  assemble:
    name: Complete matrix, hashes and release notes
    needs: [prepare, windows, linux, scan, attest, attest-addon]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && ((needs.attest.result == 'success' && needs.attest-addon.result == 'success') || github.ref_type != 'tag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release-*,attestations-*}"
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{changelog-notes,virustotal-note}"
          path: notes
          merge-multiple: true
      - name: Validate every required native asset before preparing checksums
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          if ($env:SCAN_RESULT -ne 'skipped' -and -not (Test-Path notes/virustotal.md)) {
            "## Security check`n`nThe VirusTotal scan did not finish for this release." | Set-Content notes/virustotal.md -Encoding utf8NoBOM
          }
          $scan = if (Test-Path notes/virustotal.md) { 'notes/virustotal.md' }
          .github/scripts/assemble-release.ps1 -AssetDirectory assets -NotesPath notes/release-notes.md -OutputNotesPath notes/final-notes.md -VirusTotalNotePath $scan -Repository $env:REPOSITORY -Version $env:VERSION -Revision $env:GITHUB_SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/final-notes.md
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, assemble]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ($env:REF_NAME -cne "v$env:VERSION") { throw 'Release tag and prepared version differ.' }
          $arguments = @('release', 'create', $env:REF_NAME, '--verify-tag', '--title', "P4KX $env:VERSION", '--notes-file', 'notes/final-notes.md', '--generate-notes')
          if ($env:VERSION.Contains('-')) { $arguments += '--prerelease' }
          $arguments += @(Get-ChildItem -LiteralPath assets -File | ForEach-Object FullName)
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
