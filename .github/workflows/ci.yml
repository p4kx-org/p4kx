name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci

jobs:
  platforms:
    name: Native platform contract
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and publish the four native rows
        id: platforms
        shell: pwsh
        run: .github/scripts/read-platform-matrix.ps1
      - name: Platform contract regression cases
        shell: pwsh
        run: .github/scripts/test-platform-contract.ps1
      - name: Native image and archive evidence regression cases
        shell: pwsh
        run: .github/scripts/test-native-evidence.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'native-evidence-fixtures')
      - name: Complete release matrix regression cases
        shell: pwsh
        run: .github/scripts/test-release-matrix.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'release-matrix-fixtures')

  lint:
    name: Lint (${{ matrix.target }})
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      P4KX_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          target: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Formatting, one package at a time to keep the Windows command line short
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Workspace metadata failed.' }
          foreach ($package in $metadata.packages) {
            cargo fmt -p $package.name --check
            if ($LASTEXITCODE -ne 0) { throw "Formatting failed for $($package.name)." }
          }
      - run: cargo clippy --workspace --all-targets --target $env:P4KX_TARGET --locked -- -D warnings
      - name: Check the opt-in MSI fixture on the native target
        run: cargo clippy -p p4kx-msi-path --all-targets --features native-fixtures --target $env:P4KX_TARGET --locked -- -D warnings
      - run: cargo xtask
      - name: Install cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices are complete
        if: runner.os == 'Linux'
        run: cargo xtask notices
      - name: The desktop file is valid
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils && desktop-file-validate packaging/linux/p4kx.desktop
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  tests:
    name: Native tests (${{ matrix.target }})
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      partitions: ${{ toJSON(matrix.partitions) }}
      count: ${{ matrix.count }}

  doctests:
    name: Doctests (${{ matrix.target }})
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      P4KX_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: doctests
          target: ${{ matrix.target }}
      - name: Doctests, which nextest does not run
        run: cargo test --workspace --target $env:P4KX_TARGET --locked --doc
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /
  focused:
    name: Schemas and concurrency (${{ matrix.target }})
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      P4KX_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: focused
          target: ${{ matrix.target }}
          nextest: "true"
      - name: Comparison report schema is current
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-comparison --test report_schema
      - name: Blender package schema is current
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-blender --test schema
      - name: Record JSON schema matches the export
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-export --test record_json_schema
      - name: Basetool catalog schema is current
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-export --test catalog_schema
      - name: Native Linux disk texture permission failures remain errors
        if: runner.os == 'Linux'
        run: |
          $permissionRunnerIdentityLines = @(& id -u)
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the native permission runner user ID.' }
          [uint32]$permissionRunnerUserId = 0
          if ($permissionRunnerIdentityLines.Count -ne 1 -or
              [string]$permissionRunnerIdentityLines[0] -cnotmatch '\A[0-9]+\z' -or
              -not [uint32]::TryParse([string]$permissionRunnerIdentityLines[0], [ref]$permissionRunnerUserId) -or
              $permissionRunnerUserId -eq 0) {
            throw 'Native permission tests require one valid non-root user ID.'
          }
          cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-extraction --lib --run-ignored ignored-only --no-tests fail -E 'test(/^disk_textures::tests::native_/)'
          if ($LASTEXITCODE -ne 0) { throw 'Native Linux disk texture permission tests failed.' }
      - name: DataForge lazy indexes survive concurrent lookups
        run: cargo nextest run --cargo-profile concurrency --target $env:P4KX_TARGET --locked -p p4kx-dataforge --test lazy_indexes
      - name: Audio index survives concurrent first use
        run: cargo nextest run --cargo-profile concurrency --target $env:P4KX_TARGET --locked -p p4kx-assembly --test audio_lazy_index
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  blender-addon:
    name: Blender add-on (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: blender_addon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: blender_addon/requirements-ci.txt
      - name: Install system libraries of the bpy module
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxi6 libxrender1 libsm6 libxxf86vm1 libxfixes3 libxkbcommon0
        working-directory: .
      - name: Install pytest and Blender as a Python module
        run: python -m pip install -r requirements-ci.txt
      - name: Add-on tests without Blender
        run: python -m pytest
      - name: Import a synthetic package in headless Blender
        run: python tests/blender_smoke.py

  glb-validator:
    name: Khronos glTF-Validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: glb-validator
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned validator from the lockfile, without install scripts
        run: npm ci --ignore-scripts --prefix .github/glb-validator
      - name: Write the GLBs of the synthetic fixtures
        run: P4KX_VALIDATOR_DIR="$RUNNER_TEMP/validator-glbs" cargo test --locked -p p4kx-gltf --test it the_synthetic_glbs_are_written_for_the_validator
      - name: Validate them, failing on any error
        run: node .github/glb-validator/validate.mjs "$RUNNER_TEMP/validator-glbs"

  check:
    name: Check (${{ matrix.os }})
    needs: [platforms, lint, tests, doctests, focused, blender-addon, glb-validator]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Fail unless every parallel job succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
