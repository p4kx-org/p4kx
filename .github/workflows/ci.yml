name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci

jobs:
  platforms:
    name: Native platform contract
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      macos-matrix: ${{ steps.platforms.outputs.macos-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and publish the five native rows
        id: platforms
        shell: pwsh
        run: .github/scripts/read-platform-matrix.ps1
      - name: Platform contract regression cases
        shell: pwsh
        run: .github/scripts/test-platform-contract.ps1
      - name: Native image and archive evidence regression cases
        shell: pwsh
        run: .github/scripts/test-native-evidence.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'native-evidence-fixtures')
      - name: Complete release matrix regression cases
        shell: pwsh
        run: .github/scripts/test-release-matrix.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'release-matrix-fixtures')
      - name: Reject misbound macOS device receipts
        shell: pwsh
        run: .github/scripts/test-macos-device-evidence-intake.ps1
      - name: Required release scan evidence regression cases
        shell: pwsh
        run: .github/scripts/test-release-scan.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'release-scan-fixtures')

  lint:
    name: Lint (${{ matrix.target }})
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      P4KX_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          target: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Formatting, one package at a time to keep the Windows command line short
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Workspace metadata failed.' }
          foreach ($package in $metadata.packages) {
            cargo fmt -p $package.name --check
            if ($LASTEXITCODE -ne 0) { throw "Formatting failed for $($package.name)." }
          }
      - run: cargo clippy --workspace --all-targets --target $env:P4KX_TARGET --locked -- -D warnings
      - name: Check the opt-in MSI fixture on the native target
        run: cargo clippy -p p4kx-msi-path --all-targets --features native-fixtures --target $env:P4KX_TARGET --locked -- -D warnings
      - run: cargo xtask
      - name: Install cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices are complete
        if: runner.os == 'Linux'
        run: cargo xtask notices
      - name: The desktop file is valid
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils && desktop-file-validate packaging/linux/p4kx.desktop
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  tests:
    name: Native tests (${{ matrix.target }})
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    uses: ./.github/workflows/tests.yml
    with:
      os: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      partitions: ${{ toJSON(matrix.partitions) }}
      count: ${{ matrix.count }}

  doctests:
    name: Doctests (${{ matrix.target }})
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      P4KX_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: doctests
          target: ${{ matrix.target }}
      - name: Doctests, which nextest does not run
        run: cargo test --workspace --target $env:P4KX_TARGET --locked --doc
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /
  focused:
    name: Schemas and concurrency (${{ matrix.target }})
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      P4KX_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: focused
          target: ${{ matrix.target }}
          nextest: "true"
      - name: Comparison report schema is current
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-comparison --test report_schema
      - name: Export deterministic native Blender fixtures
        run: .github/scripts/export-blender-fixture.ps1 -Target $env:P4KX_TARGET -Directory (Join-Path $env:RUNNER_TEMP 'p4kx-blender-fixtures') -RunId $env:GITHUB_RUN_ID
      - name: Blender package schema is current
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-blender --test schema
      - name: Native Blender fixtures match the package schema
        env:
          P4KX_BLENDER_FIXTURES: ${{ runner.temp }}/p4kx-blender-fixtures/artifact/packages
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-blender --test portable_fixture_schema --run-ignored only --no-tests fail
      - name: Upload native Blender fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p4kx-blender-package-${{ matrix.target }}
          path: ${{ runner.temp }}/p4kx-blender-fixtures/artifact
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Record JSON schema matches the export
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-export --test record_json_schema
      - name: Basetool catalog schema is current
        run: cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-export --test catalog_schema
      - name: Native Linux disk texture permission failures remain errors
        if: runner.os == 'Linux'
        run: |
          $permissionRunnerIdentityLines = @(& id -u)
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the native permission runner user ID.' }
          [uint32]$permissionRunnerUserId = 0
          if ($permissionRunnerIdentityLines.Count -ne 1 -or
              [string]$permissionRunnerIdentityLines[0] -cnotmatch '\A[0-9]+\z' -or
              -not [uint32]::TryParse([string]$permissionRunnerIdentityLines[0], [ref]$permissionRunnerUserId) -or
              $permissionRunnerUserId -eq 0) {
            throw 'Native permission tests require one valid non-root user ID.'
          }
          cargo nextest run --target $env:P4KX_TARGET --locked -p p4kx-extraction --lib --run-ignored ignored-only --no-tests fail -E 'test(/^disk_textures::tests::native_/)'
          if ($LASTEXITCODE -ne 0) { throw 'Native Linux disk texture permission tests failed.' }
      - name: DataForge lazy indexes survive concurrent lookups
        run: cargo nextest run --cargo-profile concurrency --target $env:P4KX_TARGET --locked -p p4kx-dataforge --test lazy_indexes
      - name: Audio index survives concurrent first use
        run: cargo nextest run --cargo-profile concurrency --target $env:P4KX_TARGET --locked -p p4kx-assembly --test audio_lazy_index
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  blender-addon:
    name: Blender add-on (${{ matrix.target }})
    needs: [platforms, focused]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      P4KX_TARGET: ${{ matrix.target }}
      P4KX_PLATFORM_MATRIX: ${{ needs.platforms.outputs.matrix }}
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
        working-directory: blender_addon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: pip
          cache-dependency-path: blender_addon/requirements-ci.txt
      - name: Select the native package exchange directory
        run: |
          $exchange = Join-Path $env:RUNNER_TEMP 'p4kx-blender-exchange'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "P4KX_BLENDER_EXCHANGE=$exchange" -Encoding utf8NoBOM
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: p4kx-blender-package-*
          path: ${{ env.P4KX_BLENDER_EXCHANGE }}
          merge-multiple: false
      - name: Install pytest
        run: python -m pip install -r requirements-ci.txt
      - name: Add-on tests without Blender
        run: python -m pytest
      - name: Validate the actual packages from every native producer
        run: python tests/verify_portable_packages.py $env:P4KX_BLENDER_EXCHANGE --target $env:P4KX_TARGET
      - name: Install system libraries of the bpy module
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxi6 libxrender1 libsm6 libxxf86vm1 libxfixes3 libxkbcommon0
      - name: Import synthetic packages in native Blender 5.2 and 5.3
        if: matrix.os != 'linux' || matrix.arch != 'arm64'
        run: |
          $versions = if ($env:P4KX_TARGET -ceq 'aarch64-pc-windows-msvc') { '5.2.3' } else { @('5.2.3', '5.3.0') }
          foreach ($version in $versions) {
            python -m pip install --only-binary=bpy "bpy==$version"
            if ($LASTEXITCODE -ne 0) { throw "Native bpy $version could not be installed." }
            python tests/blender_smoke.py
            if ($LASTEXITCODE -ne 0) { throw "Blender $version synthetic smoke test failed." }
            python tests/verify_portable_packages.py $env:P4KX_BLENDER_EXCHANGE --target $env:P4KX_TARGET --bpy-version $version
            if ($LASTEXITCODE -ne 0) { throw "Blender $version native package exchange failed." }
          }

      - name: Import the exchanged packages in native Windows ARM64 Blender 5.3
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        working-directory: .
        run: .github/scripts/verify-windows-arm64-blender.ps1 -Target $env:P4KX_TARGET -ArtifactDirectory $env:P4KX_BLENDER_EXCHANGE -BuildDirectory (Join-Path $env:RUNNER_TEMP 'p4kx-blender-windows-arm64')

      - name: Import the exchanged packages in native Debian ARM64 Blender 5.2
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        working-directory: .
        run: .github/scripts/verify-arm64-blender.ps1 -Target $env:P4KX_TARGET -ArtifactDirectory $env:P4KX_BLENDER_EXCHANGE -BuildDirectory (Join-Path $env:RUNNER_TEMP 'p4kx-blender-arm64')

  glb-validator:
    name: Khronos glTF-Validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: glb-validator
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned validator from the lockfile, without install scripts
        run: npm ci --ignore-scripts --prefix .github/glb-validator
      - name: Write the GLBs of the synthetic fixtures
        run: P4KX_VALIDATOR_DIR="$RUNNER_TEMP/validator-glbs" cargo test --locked -p p4kx-gltf --test it the_synthetic_glbs_are_written_for_the_validator
      - name: Validate them, failing on any error
        run: node .github/glb-validator/validate.mjs "$RUNNER_TEMP/validator-glbs"

  check:
    name: Check (${{ matrix.os }})
    needs: [platforms, lint, tests, doctests, focused, blender-addon, glb-validator]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Fail unless every parallel job succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
