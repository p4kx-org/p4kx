name: Windows release packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      msi-version:
        required: true
        type: string
      next-msi-version:
        required: true
        type: string
      matrix:
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build native Windows (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      P4KX_TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      MSI_VERSION: ${{ inputs.msi-version }}
      NEXT_MSI_VERSION: ${{ inputs.next-msi-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: release
          nextest: "true"
      - name: Build all shipped native release applications
        run: |
          cargo build --release --locked --target $env:P4KX_TARGET -p p4kx -p p4kx-gui -p p4kx-mcp
          if ($LASTEXITCODE -ne 0) { throw 'Native release build failed.' }
      - name: Write unencrypted synthetic runtime fixture
        run: |
          $fixture = [IO.Path]::GetFullPath('target/windows-release/fixture')
          cargo run --release --locked --target $env:P4KX_TARGET -p p4kx-testkit --example native_fixture -- $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture generation failed.' }
      - name: Verify native software render execution
        id: adapter
        env:
          P4KX_REQUIRE_SOFTWARE_ADAPTER: "1"
        run: cargo nextest run --release --locked --target $env:P4KX_TARGET -p p4kx-render --lib --no-capture --no-tests fail -E 'test(the_software_adapter_is_named)'
      - name: Install pinned host packaging and target-analysis tools
        run: .github/scripts/install-windows-package-tools.ps1 -Directory (Join-Path $env:RUNNER_TEMP 'windows-package-tools')
      - name: Verify both installer schemas and malformed runtime inventories without installation
        if: matrix.arch == 'amd64'
        run: .github/scripts/test-windows-package-contract.ps1 -Directory target/windows-contract-check -Wix $env:WIX_EXE
      - name: Architecture-specific portable ZIP and MSI payloads
        run: |
          . .github/scripts/platform-contract.ps1
          New-Item -ItemType Directory -Force target/windows-release/package, target/windows-release/validation | Out-Null
          $binary = "target/$env:P4KX_TARGET/release"
          $zipName = Get-P4kxAssetName -Target $env:P4KX_TARGET -Version $env:VERSION -Package portable-zip
          $rootName = $zipName -replace '-portable\.zip$', ''
          .github/scripts/build-windows-payload.ps1 -Target $env:P4KX_TARGET -BinaryDirectory $binary -OutputDirectory "target/windows-payload/$rootName" -Package portable-zip
          Compress-Archive -Path "target/windows-payload/$rootName" -DestinationPath "target/windows-release/package/$zipName"
          .github/scripts/build-windows-payload.ps1 -Target $env:P4KX_TARGET -BinaryDirectory $binary -OutputDirectory target/windows-msi-payload -Package msi
          $msiName = Get-P4kxAssetName -Target $env:P4KX_TARGET -Version $env:VERSION -Package msi
          .github/scripts/build-msi.ps1 -Wix $env:WIX_EXE -Target $env:P4KX_TARGET -Version $env:MSI_VERSION -BinaryFolder target/windows-msi-payload -Output "target/windows-release/package/$msiName"
          .github/scripts/build-msi.ps1 -Wix $env:WIX_EXE -Target $env:P4KX_TARGET -Version $env:NEXT_MSI_VERSION -BinaryFolder target/windows-msi-payload -Output target/windows-release/validation/next.msi
          .github/scripts/check-native-platform.ps1 -Target $env:P4KX_TARGET -ArchivePath "target/windows-release/package/$zipName" -BinaryDirectory $binary -MetadataPath target/windows-release/validation/build.json
      - name: Per-target and per-binary SBOM including app-local runtime files
        run: .github/scripts/build-target-sbom.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -OutputDirectory target/windows-release/package -RuntimeInventory target/windows-msi-payload/windows-runtime.json
      - name: Record actual adapter outcome and host-tool roles
        env:
          ADAPTER_OUTCOME: ${{ steps.adapter.outcome }}
        run: |
          if ($env:ADAPTER_OUTCOME -cne 'success') { throw 'Native software adapter did not execute successfully.' }
          @{target=$env:P4KX_TARGET; revision=$env:GITHUB_SHA; outcome=$env:ADAPTER_OUTCOME} | ConvertTo-Json | Set-Content target/windows-release/validation/adapter.json -Encoding utf8NoBOM
          Copy-Item (Join-Path $env:RUNNER_TEMP 'windows-package-tools/package-tools.json') target/windows-release/validation/package-tools.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-${{ matrix.target }}
          path: |
            target/windows-release/package/*
            target/windows-release/fixture/*
            target/windows-release/validation/*.json
            target/windows-release/validation/next.msi
          if-no-files-found: error

  verify:
    name: Execute native Windows packages (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      P4KX_TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      NEXT_MSI_VERSION: ${{ inputs.next-msi-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
        with:
          target: ${{ matrix.target }}
          nextest: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-build-*
          path: artifacts
      - name: Validate release build source, native CPU and toolchain before execution
        run: |
          . .github/scripts/platform-contract.ps1
          $base = "artifacts/windows-build-$env:P4KX_TARGET"
          $zipName = Get-P4kxAssetName -Target $env:P4KX_TARGET -Version $env:VERSION -Package portable-zip
          .github/scripts/check-native-platform.ps1 -Target $env:P4KX_TARGET -ArchivePath "$base/package/$zipName" -MetadataPath "$base/validation/build.json" -ValidateArchive
      - name: Execute portable CLI, MCP and bounded GUI with isolated folders
        run: |
          . .github/scripts/platform-contract.ps1
          $base = "artifacts/windows-build-$env:P4KX_TARGET"
          $zipName = Get-P4kxAssetName -Target $env:P4KX_TARGET -Version $env:VERSION -Package portable-zip
          .github/scripts/check-portable.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -Archive "$base/package/$zipName" -FixtureDirectory "$base/fixture" -OutputDirectory target/portable-check
      - name: Exact AMD64 historical predecessor
        if: matrix.arch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force target/previous | Out-Null
          gh release download v0.2.0 --repo p4kx-org/p4kx --pattern P4K-Extractor-0.2.0-x86_64.msi --dir target/previous
          if ($LASTEXITCODE -ne 0) { throw 'Exact historical AMD64 MSI download failed.' }
      - name: Installer metadata, upgrade, downgrade, rollback, CPU replacement and preservation
        run: |
          . .github/scripts/platform-contract.ps1
          $row = Get-P4kxPlatform -Target $env:P4KX_TARGET
          $other = @((Get-P4kxPlatformContract).targets | Where-Object { $_.os -eq 'windows' -and $_.arch -ne $row.arch })[0]
          $base = "artifacts/windows-build-$env:P4KX_TARGET"
          $msiName = Get-P4kxAssetName -Target $row.target -Version $env:VERSION -Package msi
          $otherName = Get-P4kxAssetName -Target $other.target -Version $env:VERSION -Package msi
          $previous = if ($row.arch -eq 'amd64') { @{PreviousMsi='target/previous/P4K-Extractor-0.2.0-x86_64.msi'} } else { @{} }
          $upgradeCode = ([xml](Get-Content crates/p4kx-gui/wix/main.wxs)).Wix.Package.UpgradeCode
          .github/scripts/check-msi.ps1 -Target $row.target -Msi "$base/package/$msiName" -NextMsi "$base/validation/next.msi" -NextVersion $env:NEXT_MSI_VERSION -UpgradeCode $upgradeCode -OtherArchitectureMsi "artifacts/windows-build-$($other.target)/package/$otherName" -FixtureDirectory "$base/fixture" -OutputDirectory target/installer-check @previous
      - name: Record executed release payload evidence
        run: |
          $base = "artifacts/windows-build-$env:P4KX_TARGET"
          $adapter = Get-Content "$base/validation/adapter.json" -Raw | ConvertFrom-Json
          if ($adapter.target -cne $env:P4KX_TARGET -or $adapter.revision -cne $env:GITHUB_SHA -or $adapter.outcome -cne 'success') { throw 'Native adapter evidence source/CPU/outcome mismatch.' }
          $env:SOFTWARE_ADAPTER_OUTCOME = $adapter.outcome
          $output = "$base/package/P4KX-$env:VERSION-$env:P4KX_TARGET-runtime.json"
          .github/scripts/record-windows-release-runtime.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -AssetDirectory "$base/package" -PortableResult target/portable-check/smoke/runtime.json -InstalledResult target/installer-check/installed/runtime.json -InstallerResult target/installer-check/installer.json -BuildMetadata "$base/validation/build.json" -OutputPath $output
          Copy-Item "$base/validation/package-tools.json" "$base/package/P4KX-$env:VERSION-$env:P4KX_TARGET-package-tools.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-package-logs-${{ matrix.target }}
          path: |
            target/installer-check/**/*.log
            target/installer-check/**/*.json
            target/portable-check/**/*.log
            target/portable-check/smoke/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: artifacts/windows-build-${{ matrix.target }}/package/*
          if-no-files-found: error
