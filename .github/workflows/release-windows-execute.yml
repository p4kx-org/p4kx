name: Execute Windows release packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      next-msi-version:
        required: true
        type: string
      matrix:
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Execute native Windows packages (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      P4KX_TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      NEXT_MSI_VERSION: ${{ inputs.next-msi-version }}
    steps:
      - name: Bound native installer diagnostics before the job deadline
        run: '"P4KX_MSI_DIAGNOSTIC_DEADLINE_UTC=$([DateTimeOffset]::UtcNow.AddMinutes(35).ToString(''o''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create fresh native package verification folders
        run: |
          . .github/scripts/native-package-task.ps1
          $task = New-P4kxNativePackageTask -Directory $env:RUNNER_TEMP -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -Target $env:P4KX_TARGET -Role consumer
          "P4KX_PACKAGE_TASK=$task" >> $env:GITHUB_ENV
      - uses: ./.github/actions/install-rust
        with:
          target: ${{ matrix.target }}
          nextest: "true"
      - name: Download native Windows package inputs
        id: windows-input-download
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-build-*
          path: ${{ env.P4KX_PACKAGE_TASK }}/windows-inputs/first
          digest-mismatch: error
      - name: Retry native Windows package input download
        id: windows-input-retry
        if: ${{ steps.windows-input-download.outcome == 'failure' }}
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-build-*
          path: ${{ env.P4KX_PACKAGE_TASK }}/windows-inputs/retry
          digest-mismatch: error
      - name: Select the successful native Windows package inputs
        env:
          P4KX_WINDOWS_INPUTS: ${{ steps.windows-input-download.outcome == 'success' && steps.windows-input-download.outputs.download-path || steps.windows-input-retry.outputs.download-path }}
        run: |
          if (-not $env:P4KX_WINDOWS_INPUTS -or -not (Test-Path -LiteralPath $env:P4KX_WINDOWS_INPUTS -PathType Container)) {
            throw 'The verified native package input directory is missing.'
          }
          "P4KX_WINDOWS_INPUTS=$env:P4KX_WINDOWS_INPUTS" >> $env:GITHUB_ENV
      - name: Validate release build source, native CPU and toolchain before execution
        run: |
          . .github/scripts/platform-contract.ps1
          $base = Join-Path $env:P4KX_WINDOWS_INPUTS "windows-build-$env:P4KX_TARGET"
          $zipName = Get-P4kxAssetName -Target $env:P4KX_TARGET -Version $env:VERSION -Package portable-zip
          .github/scripts/check-native-platform.ps1 -Target $env:P4KX_TARGET -ArchivePath "$base/package/$zipName" -MetadataPath "$base/validation/build.json" -ValidateArchive
      - name: Execute portable CLI, MCP and bounded GUI with isolated folders
        run: |
          . .github/scripts/platform-contract.ps1
          $base = Join-Path $env:P4KX_WINDOWS_INPUTS "windows-build-$env:P4KX_TARGET"
          $zipName = Get-P4kxAssetName -Target $env:P4KX_TARGET -Version $env:VERSION -Package portable-zip
          .github/scripts/check-portable.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -Archive "$base/package/$zipName" -FixtureDirectory "$base/fixture" -OutputDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'portable-check')
      - name: Exact AMD64 historical predecessor
        if: matrix.arch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = Join-Path $env:P4KX_PACKAGE_TASK 'previous'
          New-Item -ItemType Directory -Force $previous | Out-Null
          gh release download v0.2.0 --repo p4kx-org/p4kx --pattern P4K-Extractor-0.2.0-x86_64.msi --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Exact historical AMD64 MSI download failed.' }
      - name: Pure exact-PATH validator and run-all mocks
        run: |
          .github/scripts/test-msi-feedback-workflow.ps1
          .github/scripts/test-msi-feedback-budget.ps1
          .github/scripts/test-msi-feedback-chain-workflow.ps1
          .github/scripts/test-msi-phase-journal-encoding.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/msi-phase-journal-encoding')
          .github/scripts/test-msi-feedback-parent.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/msi-feedback-parent')
          .github/scripts/test-msi-snapshot-console.ps1
          .github/scripts/test-msi-snapshot-delay.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/msi-snapshot-delay')
          .github/scripts/test-msi-snapshot-budget.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/msi-snapshot-budget')
          foreach ($case in @('Complete','Timeout','Admission')) {
            .github/scripts/test-msi-observer.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK ('contracts/msi-observer-'+$case.ToLowerInvariant())) -Case $case -Milliseconds 10000 -SnapshotWaitMilliseconds 250 -DetachedFinish
          }
          .github/scripts/test-msi-diagnostics.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/msi-diagnostics')
          .github/scripts/test-msi-diagnostic-failures.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/msi-diagnostic-failures')
          .github/scripts/test-msi-raw-fixture.ps1
          .github/scripts/test-msi-path-verification.ps1
      - name: Compile source-bound opt-in raw Registry fixture
        run: |
          $original = $env:P4KX_FIXTURE_SOURCE_REVISION
          try {
            $env:P4KX_FIXTURE_SOURCE_REVISION = $env:GITHUB_SHA
            cargo build --release --locked --target $env:P4KX_TARGET -p p4kx-msi-path --example p4kx-msi-registry-fixture --features native-fixtures
            if ($LASTEXITCODE -ne 0) { throw 'Opt-in Registry fixture compilation failed.' }
          } finally { $env:P4KX_FIXTURE_SOURCE_REVISION = $original }
      - name: Prepare installer inputs and the independent step allowance
        id: msi-preflight
        timeout-minutes: 1
        run: |
          . .github/scripts/platform-contract.ps1
          . .github/scripts/msi-diagnostic-runner.ps1
          $row = Get-P4kxPlatform -Target $env:P4KX_TARGET
          $other = @((Get-P4kxPlatformContract).targets | Where-Object { $_.os -eq 'windows' -and $_.arch -ne $row.arch })[0]
          $base = Join-Path $env:P4KX_WINDOWS_INPUTS "windows-build-$($row.target)"
          $otherBase = Join-Path $env:P4KX_WINDOWS_INPUTS "windows-build-$($other.target)"
          $msiName = Get-P4kxAssetName -Target $row.target -Version $env:VERSION -Package msi
          $otherName = Get-P4kxAssetName -Target $other.target -Version $env:VERSION -Package msi
          $registryFixture = "target/$env:P4KX_TARGET/release/examples/p4kx-msi-registry-fixture.exe"
          $output = Join-Path $env:P4KX_PACKAGE_TASK 'installer-check'
          $parameters = @{
            Target = $row.target
            Msi = "$base/package/$msiName"
            NextMsi = "$base/validation/next.msi"
            NextVersion = $env:NEXT_MSI_VERSION
            UpgradeCode = ([xml](Get-Content crates/p4kx-gui/wix/main.wxs)).Wix.Package.UpgradeCode
            OtherArchitectureMsi = "$otherBase/package/$otherName"
            FixtureDirectory = "$base/fixture"
            OutputDirectory = $output
            RegistryFixture = $registryFixture
            RegistryFixtureSha256 = (Get-FileHash -LiteralPath $registryFixture -Algorithm SHA256).Hash.ToLowerInvariant()
            HelperExecutable = "$base/msi-helper/payload/p4kx-msi-path.exe"
          }
          if ($row.arch -ceq 'amd64') {
            $parameters.PreviousMsi = Join-Path $env:P4KX_PACKAGE_TASK 'previous/P4K-Extractor-0.2.0-x86_64.msi'
          }
          $parameters | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $env:P4KX_PACKAGE_TASK 'msi-invocation.json') -Encoding utf8NoBOM
          $feedback = Join-Path $output 'feedback'
          .github/scripts/prepare-msi-feedback.ps1 -Directory $feedback
          Write-P4kxMsiDiagnosticSources $parameters .github/scripts $feedback
          Write-P4kxMsiDiagnosticInputs $parameters $feedback
      - name: Preserve prepared allowance, inputs and executed parent controls
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: windows-msi-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/feedback/*.json
            ${{ env.P4KX_PACKAGE_TASK }}/contracts/msi-feedback-parent/**/*.json
            ${{ env.P4KX_PACKAGE_TASK }}/contracts/msi-feedback-parent/**/*.jsonl
            ${{ env.P4KX_PACKAGE_TASK }}/contracts/msi-feedback-parent/**/*.log
          if-no-files-found: error
      - name: Observe native MSI worker admission without installing
        id: msi-admission
        timeout-minutes: 2
        continue-on-error: true
        run: |
          $invocation = Join-Path $env:P4KX_PACKAGE_TASK 'msi-invocation.json'
          $parameters = Get-Content -LiteralPath $invocation -Raw | ConvertFrom-Json -AsHashtable
          $parameters.OutputDirectory = Join-Path $env:P4KX_PACKAGE_TASK 'msi-admission'
          .github/scripts/check-msi.ps1 @parameters -AdmissionOnly
      - name: Preserve native MSI worker admission evidence
        if: ${{ always() && !cancelled() && steps.msi-admission.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        continue-on-error: true
        with:
          name: windows-msi-admission-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/msi-admission/diagnostics/*.json
            ${{ env.P4KX_PACKAGE_TASK }}/msi-admission/diagnostics/*.jsonl
            ${{ env.P4KX_PACKAGE_TASK }}/msi-admission/diagnostics/*.log
          if-no-files-found: error
      - name: Refresh installer allowance against the original deadline
        id: msi-budget
        timeout-minutes: 1
        run: .github/scripts/prepare-msi-feedback.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/lifecycle-feedback')
      - name: Installer metadata, upgrade, downgrade, rollback, CPU replacement and preservation
        id: msi-launch
        timeout-minutes: ${{ fromJSON(steps.msi-budget.outputs.minutes) }}
        run: |
          . .github/scripts/msi-diagnostic-budget.ps1
          Assert-P4kxMsiStepAdmission $env:P4KX_MSI_DIAGNOSTIC_DEADLINE_UTC $env:P4KX_MSI_STEP_MINUTES $env:P4KX_MSI_STEP_COMPUTED_AT_UTC
          $invocation = Join-Path $env:P4KX_PACKAGE_TASK 'msi-invocation.json'
          .github/scripts/invoke-msi-observer.ps1 -Stage Start -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer') -Invocation $invocation
      - name: Preserve original MSI observer start
        if: ${{ always() && !cancelled() && steps.msi-launch.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        continue-on-error: true
        with:
          name: windows-msi-start-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/request.json
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/handle.json
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/parent-start.json
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/diagnostic-sources.json
          if-no-files-found: error
      - name: Preserve original MSI phase checkpoint 1
        id: msi-checkpoint-1
        if: ${{ always() && !cancelled() && steps.msi-launch.outcome == 'success' && env.P4KX_MSI_OBSERVER_FINISHED != 'true' }}
        timeout-minutes: 2
        run: .github/scripts/invoke-msi-observer.ps1 -Stage Snapshot -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer') -Sequence 1 -WaitMilliseconds 0
      - name: Upload original MSI phase checkpoint 1
        if: ${{ always() && !cancelled() && steps.msi-launch.outcome == 'success' && steps.msi-checkpoint-1.outcome != 'skipped' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.P4KX_TARGET }}-1
          path: ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/*/01/*
          if-no-files-found: error
      - name: Observe the original ARM64 MSI Registry capture
        id: msi-passive-checkpoint
        if: ${{ always() && !cancelled() && matrix.arch == 'arm64' && steps.msi-launch.outcome == 'success' && env.P4KX_MSI_OBSERVER_FINISHED != 'true' }}
        timeout-minutes: 1
        continue-on-error: true
        run: .github/scripts/invoke-msi-observer.ps1 -Stage Snapshot -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer') -Sequence 2 -WaitMilliseconds 0 -OriginalRawBoundary
      - name: Upload the original ARM64 MSI Registry capture checkpoint
        if: ${{ always() && !cancelled() && steps.msi-passive-checkpoint.outcome != 'skipped' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.P4KX_TARGET }}-2
          path: ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/*/02/*
          if-no-files-found: error
      - name: Observe the first original MSI install outcome
        id: msi-install-checkpoint
        if: ${{ always() && !cancelled() && steps.msi-launch.outcome == 'success' && env.P4KX_MSI_OBSERVER_FINISHED != 'true' }}
        timeout-minutes: 1
        continue-on-error: true
        run: .github/scripts/invoke-msi-observer.ps1 -Stage Snapshot -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer') -Sequence 3 -WaitMilliseconds 0 -OriginalInstallBoundary
      - name: Upload the first original MSI install checkpoint
        if: ${{ always() && !cancelled() && steps.msi-install-checkpoint.outcome != 'skipped' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.P4KX_TARGET }}-3
          path: ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/*/03/*
          if-no-files-found: error
      - name: Start the isolated original MSI Finish supervisor
        id: msi-finish-start
        if: ${{ always() && !cancelled() && steps.msi-launch.outcome == 'success' }}
        timeout-minutes: 1
        run: .github/scripts/invoke-msi-observer.ps1 -Stage StartFinish -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer')
      - name: Preserve original MSI Finish supervisor launch
        if: ${{ always() && !cancelled() && steps.msi-finish-start.outcome == 'success' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.P4KX_TARGET }}-finish-start
          path: ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/finish-supervision/launch.json
          if-no-files-found: error
      - name: Observe original MSI Finish progress 4
        id: msi-finish-progress-4
        if: ${{ always() && !cancelled() && steps.msi-finish-start.outcome == 'success' }}
        timeout-minutes: 1
        continue-on-error: true
        run: .github/scripts/invoke-msi-observer.ps1 -Stage ProbeFinish -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer') -Sequence 4
      - name: Preserve original MSI Finish progress 4
        if: ${{ always() && !cancelled() && steps.msi-finish-progress-4.outcome != 'skipped' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.P4KX_TARGET }}-4
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/checkpoints/04/*
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/finish-probes/04/*.json
          if-no-files-found: error
      - name: Observe original MSI Finish progress 5
        id: msi-finish-progress-5
        if: ${{ always() && !cancelled() && steps.msi-finish-start.outcome == 'success' }}
        timeout-minutes: 1
        continue-on-error: true
        run: .github/scripts/invoke-msi-observer.ps1 -Stage ProbeFinish -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer') -Sequence 5
      - name: Preserve original MSI Finish progress 5
        if: ${{ always() && !cancelled() && steps.msi-finish-progress-5.outcome != 'skipped' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.P4KX_TARGET }}-5
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/checkpoints/05/*
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/finish-probes/05/*.json
          if-no-files-found: error
      - name: Wait for the original MSI Finish receipt
        id: msi-finish-wait
        if: ${{ always() && !cancelled() && steps.msi-finish-start.outcome == 'success' }}
        timeout-minutes: ${{ fromJSON(steps.msi-budget.outputs.observer_finish_minutes) }}
        run: .github/scripts/invoke-msi-observer.ps1 -Stage WaitFinish -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer')
      - name: Upload final original MSI lifecycle evidence
        id: msi-finish-evidence
        if: ${{ always() && !cancelled() && steps.msi-launch.outcome == 'success' && steps.msi-finish-wait.outcome != 'skipped' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msi-observer-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.P4KX_TARGET }}-final
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/checkpoints/09/*
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/snapshots/09/*
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/finish-supervision/*
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/observer/observer-result.json
          if-no-files-found: error
      - name: Finish the original native MSI lifecycle
        id: msi-finish
        if: ${{ always() && !cancelled() && steps.msi-finish-wait.outcome == 'success' && steps.msi-finish-evidence.outcome == 'success' }}
        timeout-minutes: 1
        run: .github/scripts/invoke-msi-observer.ps1 -Stage CollectFinish -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/observer')
      - name: Record executed release payload evidence
        run: |
          $base = Join-Path $env:P4KX_WINDOWS_INPUTS "windows-build-$env:P4KX_TARGET"
          $adapter = Get-Content "$base/validation/adapter.json" -Raw | ConvertFrom-Json
          if ($adapter.target -cne $env:P4KX_TARGET -or $adapter.revision -cne $env:GITHUB_SHA -or $adapter.outcome -cne 'success') { throw 'Native adapter evidence source/CPU/outcome mismatch.' }
          $env:SOFTWARE_ADAPTER_OUTCOME = $adapter.outcome
          $output = "$base/package/P4KX-$env:VERSION-$env:P4KX_TARGET-runtime.json"
          .github/scripts/record-windows-release-runtime.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -AssetDirectory "$base/package" -PortableResult (Join-Path $env:P4KX_PACKAGE_TASK 'portable-check/smoke/runtime.json') -InstalledResult (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/installed/runtime.json') -InstallerResult (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/installer.json') -BuildMetadata "$base/validation/build.json" -OutputPath $output
          Copy-Item "$base/validation/package-tools.json" "$base/package/P4KX-$env:VERSION-$env:P4KX_TARGET-package-tools.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: windows-package-logs-${{ matrix.target }}
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/**/*.log
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/**/*.json
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/**/*.jsonl
            ${{ env.P4KX_PACKAGE_TASK }}/portable-check/**/*.log
            ${{ env.P4KX_PACKAGE_TASK }}/portable-check/smoke/*.json
            ${{ env.P4KX_PACKAGE_TASK }}/contracts/msi-feedback-parent/**/*.json
            ${{ env.P4KX_PACKAGE_TASK }}/contracts/msi-feedback-parent/**/*.jsonl
            ${{ env.P4KX_PACKAGE_TASK }}/contracts/msi-feedback-parent/**/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.P4KX_WINDOWS_INPUTS }}/windows-build-${{ matrix.target }}/package/*
          if-no-files-found: error
