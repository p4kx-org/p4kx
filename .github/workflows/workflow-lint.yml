name: Workflow lint

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  merge_group:

permissions: {}

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        shell: pwsh
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          . .github/scripts/linux-package-tools.ps1
          $archive = "actionlint_$($env:ACTIONLINT_VERSION)_linux_amd64.tar.gz"
          $download = Join-Path $env:RUNNER_TEMP 'actionlint.tar.gz'
          Save-P4kxPinnedDownload "https://github.com/rhysd/actionlint/releases/download/v$($env:ACTIONLINT_VERSION)/$archive" $env:ACTIONLINT_SHA256 $download
          tar -xzf $download -C $env:RUNNER_TEMP actionlint
          if ($LASTEXITCODE -ne 0) { throw 'Pinned actionlint extraction failed.' }
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install zizmor
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/zizmor.txt
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular --format=plain .github
