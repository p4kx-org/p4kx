name: Windows MSI observation control

on:
  workflow_call:

permissions: {}

concurrency:
  group: windows-msi-observation-control-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read native Windows registry
        id: platforms
        shell: pwsh
        run: .github/scripts/read-platform-matrix.ps1 -Os windows

  control:
    name: Native detached control (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      P4KX_TARGET: ${{ matrix.target }}
    steps:
      - name: Preserve the original absolute diagnostic deadline
        run: '"P4KX_MSI_DIAGNOSTIC_DEADLINE_UTC=$([DateTimeOffset]::UtcNow.AddMinutes(35).ToString(''o''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create isolated native control folders
        run: |
          . .github/scripts/native-package-task.ps1
          $task = New-P4kxNativePackageTask -Directory $env:RUNNER_TEMP -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -Target $env:P4KX_TARGET -Role consumer
          "P4KX_CONTROL_TASK=$task/detached-control" >> $env:GITHUB_ENV
      - name: Check harmless ownership and deadline controls
        timeout-minutes: 1
        run: .github/scripts/test-msi-detached-control.ps1 -Directory ($env:P4KX_CONTROL_TASK+'-contracts')
      - name: Observe Finish progress while its harmless worker is held
        timeout-minutes: 2
        run: .github/scripts/test-msi-observer.ps1 -Directory ($env:P4KX_CONTROL_TASK+'-finish-probe') -Case Complete -DetachedFinish -LiveFinishProbe
      - name: Start harmless tracked phase worker and leave its launcher
        timeout-minutes: 1
        run: .github/scripts/invoke-msi-detached-control.ps1 -Stage Start -Directory $env:P4KX_CONTROL_TASK
      - name: Observe the exact live worker from another step
        timeout-minutes: 1
        run: .github/scripts/invoke-msi-detached-control.ps1 -Stage Snapshot -Directory $env:P4KX_CONTROL_TASK
      - name: Preserve active phase checkpoint before worker release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: windows-msi-detached-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ env.P4KX_CONTROL_TASK }}/checkpoint/*
          if-no-files-found: error
      - name: Release and verify only the owned harmless worker
        if: always()
        timeout-minutes: 1
        run: .github/scripts/invoke-msi-detached-control.ps1 -Stage Finish -Directory $env:P4KX_CONTROL_TASK
      - name: Preserve control completion and source-bound diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: windows-msi-detached-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ env.P4KX_CONTROL_TASK }}/*.json
            ${{ env.P4KX_CONTROL_TASK }}/*.log
            ${{ env.P4KX_CONTROL_TASK }}/diagnostics/*
            ${{ env.P4KX_CONTROL_TASK }}-contracts/**/*.json
            ${{ env.P4KX_CONTROL_TASK }}-contracts/**/*.jsonl
            ${{ env.P4KX_CONTROL_TASK }}-contracts/**/*.log
          if-no-files-found: error
      - name: Start the harmless native successive observer
        id: successive-start
        timeout-minutes: 1
        run: .github/scripts/invoke-msi-successive-control.ps1 -Stage Start -Directory ($env:P4KX_CONTROL_TASK+'-successive')
      - name: Observe the original harmless worker immediately
        id: successive-first
        timeout-minutes: 2
        run: .github/scripts/invoke-msi-successive-control.ps1 -Stage Snapshot -Sequence 1 -Directory ($env:P4KX_CONTROL_TASK+'-successive')
      - name: Upload the first harmless observer checkpoint
        if: ${{ always() && !cancelled() && steps.successive-start.outcome == 'success' && steps.successive-first.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: windows-msi-successive-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-1
          path: |
            ${{ env.P4KX_CONTROL_TASK }}-successive/snapshot-budget-01.json
            ${{ env.P4KX_CONTROL_TASK }}-successive/observer/checkpoints/01/*
            ${{ env.P4KX_CONTROL_TASK }}-successive/observer/snapshots/01/*
          if-no-files-found: error
      - name: Observe the same harmless worker after the waited interval
        id: successive-second
        timeout-minutes: 2
        run: .github/scripts/invoke-msi-successive-control.ps1 -Stage Snapshot -Sequence 2 -Directory ($env:P4KX_CONTROL_TASK+'-successive')
      - name: Upload the second harmless observer checkpoint
        if: ${{ always() && !cancelled() && steps.successive-start.outcome == 'success' && steps.successive-second.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: windows-msi-successive-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-2
          path: |
            ${{ env.P4KX_CONTROL_TASK }}-successive/snapshot-budget-02.json
            ${{ env.P4KX_CONTROL_TASK }}-successive/observer/checkpoints/02/*
            ${{ env.P4KX_CONTROL_TASK }}-successive/observer/snapshots/02/*
          if-no-files-found: error
      - name: Release and verify the held harmless original
        if: ${{ always() && !cancelled() && steps.successive-second.outcome == 'success' }}
        timeout-minutes: 1
        run: .github/scripts/invoke-msi-successive-control.ps1 -Stage Finish -Directory ($env:P4KX_CONTROL_TASK+'-successive')
      - name: Prepare isolated harmless MSI split-delay binding
        timeout-minutes: 1
        run: |
          $delayControl = $env:P4KX_CONTROL_TASK + '-split-delay'
          $env:P4KX_MSI_DIAGNOSTIC_DEADLINE_UTC = [DateTimeOffset]::UtcNow.AddMinutes(3).ToString('o')
          .github/scripts/invoke-msi-split-delay-control.ps1 -Stage Prepare -Directory $delayControl
          "P4KX_SPLIT_DELAY_DEADLINE=$env:P4KX_MSI_DIAGNOSTIC_DEADLINE_UTC" >> $env:GITHUB_ENV
          "P4KX_MSI_DELAY_CONTROL=$delayControl" >> $env:GITHUB_ENV
      - name: Upload harmless control completion
        if: ${{ always() && !cancelled() && steps.successive-second.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: windows-msi-successive-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-final
          path: |
            ${{ env.P4KX_CONTROL_TASK }}-successive/observer/observer-result.json
            ${{ env.P4KX_CONTROL_TASK }}-successive/observer/checkpoints/09/*
          if-no-files-found: error
      - name: Wait separately for harmless MSI split-delay control
        id: harmless-split-delay
        timeout-minutes: 2
        env:
          P4KX_MSI_DIAGNOSTIC_DEADLINE_UTC: ${{ env.P4KX_SPLIT_DELAY_DEADLINE }}
        run: .github/scripts/invoke-msi-observer.ps1 -Stage Delay -Directory $env:P4KX_MSI_DELAY_CONTROL -Sequence 2 -WaitMilliseconds 75000
      - name: Verify harmless MSI split-delay control
        timeout-minutes: 1
        env:
          P4KX_MSI_DIAGNOSTIC_DEADLINE_UTC: ${{ env.P4KX_SPLIT_DELAY_DEADLINE }}
        run: .github/scripts/invoke-msi-split-delay-control.ps1 -Stage Verify -Directory $env:P4KX_MSI_DELAY_CONTROL
      - name: Upload harmless MSI split-delay control
        if: ${{ always() && steps.harmless-split-delay.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: windows-msi-split-delay-control-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ env.P4KX_MSI_DELAY_CONTROL }}/request.json
            ${{ env.P4KX_MSI_DELAY_CONTROL }}/delays/02/*.json
            ${{ env.P4KX_MSI_DELAY_CONTROL }}/split-delay-control-result.json
          if-no-files-found: error
