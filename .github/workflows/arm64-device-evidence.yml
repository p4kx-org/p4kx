name: Validate Windows and Linux ARM64 device evidence

on:
  workflow_dispatch:
    inputs:
      candidate-run-id:
        description: Tag-triggered Release workflow run ID
        required: true
        type: string
      arm64-device-evidence:
        description: Native Windows and Linux ARM64 device receipt JSON array
        required: true
        type: string

permissions: {}

jobs:
  intake:
    name: Verify and retain native ARM64 device evidence
    if: github.repository == 'p4kx-org/p4kx' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the original ARM64 package runtime receipts
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
        run: |
          . .github/scripts/arm64-device-evidence-intake.ps1
          $candidate = Resolve-P4kxArm64IntakeCandidate $env:CANDIDATE_RUN_ID
          foreach ($key in $candidate.Keys) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$key=$($candidate[$key])" -Encoding utf8
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.candidate.outputs.runtime-ids }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          path: candidate/runtime
          merge-multiple: true
          digest-mismatch: error
      - name: Validate the native observations against the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run-id }}
        run: |
          . .github/scripts/arm64-device-evidence-intake.ps1
          New-Item -ItemType Directory -Path 'device-intake' | Out-Null
          Save-P4kxArm64DeviceIntake 'candidate/runtime' 'device-intake' $env:VERSION $env:CANDIDATE_RUN_ID
      - name: Attest the binding between the runtime receipts and native observations
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: device-intake/binding.json
      - name: Retain the portable binding attestation
        env:
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:BUNDLE -Destination 'device-intake/binding.sigstore.json'
      - name: Retain the exact native receipts and signed binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: |
            device-intake/device-evidence.json
            device-intake/binding.json
            device-intake/binding.sigstore.json
          if-no-files-found: error
