name: MSI dynamic parent-chain probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/msi-feedback-chain-probe.yml
      - .github/workflows/release-windows.yml
      - .github/scripts/*msi-feedback*.ps1
      - .github/scripts/msi-diagnostic-*.ps1
      - .github/scripts/portal-process.ps1
      - .github/scripts/package-process.ps1

concurrency:
  group: msi-feedback-chain-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  platforms:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify diagnostic workflow boundaries
        shell: pwsh
        run: |
          .github/scripts/test-msi-feedback-workflow.ps1
          .github/scripts/test-msi-feedback-budget.ps1
          .github/scripts/test-msi-feedback-chain-workflow.ps1
      - id: platforms
        shell: pwsh
        run: .github/scripts/read-platform-matrix.ps1 -Os windows

  chain:
    name: MSI feedback chain (${{ matrix.platform.target }}, ${{ matrix.mode }})
    needs: platforms
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.mode == 'outer-runner' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.matrix).include }}
        mode: [complete, inner-watchdog, outer-runner]
    env:
      P4KX_TARGET: ${{ matrix.platform.target }}
      P4KX_MSI_CHAIN_MODE: ${{ matrix.mode }}
      P4KX_MSI_PROBE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create isolated diagnostic task
        run: |
          . .github/scripts/native-package-task.ps1
          $task=New-P4kxNativePackageTask -Directory $env:RUNNER_TEMP -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -Target $env:P4KX_TARGET -Role consumer
          "P4KX_PACKAGE_TASK=$task" >> $env:GITHUB_ENV
      - name: Exercise actual completed and inner-watchdog parent controls
        run: .github/scripts/test-msi-feedback-parent.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/msi-feedback-parent')
      - name: Prepare original dynamic chain allowance
        id: msi-budget
        timeout-minutes: 1
        run: .github/scripts/prepare-msi-feedback-chain.ps1 -Target $env:P4KX_TARGET -Mode $env:P4KX_MSI_CHAIN_MODE -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check/feedback')
      - name: Preserve original prepared chain receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 1
        with:
          name: msi-chain-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform.target }}-${{ matrix.mode }}-prepared
          path: ${{ env.P4KX_PACKAGE_TASK }}/installer-check/feedback/*.json
          if-no-files-found: error
      - name: Dynamic parent and Portal fixture
        timeout-minutes: ${{ fromJSON(steps.msi-budget.outputs.minutes) }}
        run: .github/scripts/invoke-msi-feedback-chain.ps1 -Target $env:P4KX_TARGET -Mode $env:P4KX_MSI_CHAIN_MODE -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'installer-check')
      - name: Upload original parent-chain capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: msi-chain-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform.target }}-${{ matrix.mode }}
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/**/*.json
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/**/*.jsonl
            ${{ env.P4KX_PACKAGE_TASK }}/installer-check/**/*.log
          if-no-files-found: error

  verify:
    name: Verify dynamic native cancellation and original capture
    needs: [platforms, chain]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      P4KX_MSI_PROBE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 3
        with:
          pattern: msi-chain-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/msi-chain-artifacts
      - name: Require dynamic timeout service and original evidence
        shell: pwsh
        timeout-minutes: 5
        run: .github/scripts/verify-msi-feedback-run.ps1 -Experiment chain -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'msi-chain-artifacts') -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'msi-chain-verification')
      - name: Upload independent chain verdict
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 2
        with:
          name: msi-chain-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/msi-chain-verification/*.json
          if-no-files-found: error
