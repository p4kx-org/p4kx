name: Linux release packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      matrix:
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build native Linux (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      P4KX_TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      P4KX_REQUIRE_SOFTWARE_ADAPTER: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a fresh package task outside the Cargo cache
        run: |
          . .github/scripts/native-package-task.ps1
          $task = New-P4kxNativePackageTask -Directory $env:RUNNER_TEMP -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -Target $env:P4KX_TARGET -Role producer
          "P4KX_PACKAGE_TASK=$task" >> $env:GITHUB_ENV
          .github/scripts/test-native-package-task.ps1 -Directory (Join-Path $task 'contracts/task-paths')
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: linux-release
          cache-on-failure: "true"
          nextest: "true"
      - name: Install native baseline, desktop, source and package dependencies
        run: .github/scripts/install-linux-package-dependencies.ps1 -Build
      - name: Source-bound reproducible package timestamp
        run: |
          $epoch = git show -s --format=%ct $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0 -or $epoch -cnotmatch '^[0-9]+$') { throw 'Source timestamp query failed.' }
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV
      - name: Verify Linux package and ABI contracts
        run: |
          .github/scripts/test-build-tools-output.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/build-tool-output')
          .github/scripts/test-linux-source-tree.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/source-tree')
          .github/scripts/test-linux-appdir-root.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/appdir-root')
          .github/scripts/test-linux-package-contract.ps1 -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/linux-package')
          python3 -B packaging/linux/runtime/test_collect_sources.py --directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/runtime-sources')
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime source inventory contract failed.' }
          python3 -B packaging/linux/runtime/test_build_inputs.py --directory (Join-Path $env:P4KX_PACKAGE_TASK 'contracts/runtime-inputs')
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime compiled-input binding contract failed.' }
      - name: Build all three shipped native release applications
        run: |
          cargo build --release --locked --target $env:P4KX_TARGET -p p4kx -p p4kx-gui -p p4kx-mcp
          if ($LASTEXITCODE -ne 0) { throw 'Native Linux release build failed.' }
          $fixture = Join-Path $env:P4KX_PACKAGE_TASK 'fixture'
          cargo run --release --locked --target $env:P4KX_TARGET -p p4kx-testkit --example native_fixture -- $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture generation failed.' }
      - name: Execute the native Mesa software adapter
        id: adapter
        run: cargo nextest run --release --locked --target $env:P4KX_TARGET -p p4kx-render --lib --no-capture --no-tests fail -E 'test(the_software_adapter_is_named)'
      - name: Install pinned native host packaging and SBOM tools
        run: |
          . .github/scripts/linux-package-tools.ps1
          Install-P4kxLinuxPackageTools -Target $env:P4KX_TARGET -Directory (Join-Path $env:P4KX_PACKAGE_TASK 'tools')
      - name: Build the native static AppImage runtime and corresponding source
        run: .github/scripts/build-linux-runtime.ps1 -Target $env:P4KX_TARGET -StagingDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'runtime-build') -OutputDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'runtime')
      - name: Build native tar.gz, AppImage, deb and Flatpak from the release executables
        run: |
          $binary = "target/$env:P4KX_TARGET/release"
          $output = Join-Path $env:P4KX_PACKAGE_TASK 'package'
          try {
            .github/scripts/build-linux-tar.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -BinaryDirectory $binary -OutputDirectory $output -StagingDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'tar')
            .github/scripts/build-linux-appimage.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -BinaryDirectory $binary -OutputDirectory $output -StagingDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'appimage') -ToolsDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'tools') -RuntimeDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'runtime')
            .github/scripts/build-linux-deb.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -BinaryDirectory $binary -OutputDirectory $output -StagingDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'deb')
            $env:FLATPAK_USER_DIR = Join-Path $env:P4KX_PACKAGE_TASK 'flatpak-installation'
            .github/scripts/build-linux-flatpak.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -BinaryDirectory $binary -OutputDirectory $output -StagingDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'flatpak')
          }
          catch {
            [Console]::Error.WriteLine($_.ScriptStackTrace)
            throw
          }
      - name: Target-specific application and bundled runtime SBOMs
        run: |
          .github/scripts/build-target-sbom.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -OutputDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'package')
          .github/scripts/enrich-linux-sbom.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -AssetDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'package') -AppDir (Join-Path $env:P4KX_PACKAGE_TASK 'appimage/AppDir') -RuntimeDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'runtime')
      - name: Bind source, native CPU, exact compiler and actual software-adapter execution
        env:
          ADAPTER_OUTCOME: ${{ steps.adapter.outcome }}
        run: |
          . .github/scripts/platform-contract.ps1
          if ($env:ADAPTER_OUTCOME -cne 'success') { throw 'Native software adapter did not execute successfully.' }
          $validation = Join-Path $env:P4KX_PACKAGE_TASK 'validation'
          New-Item -ItemType Directory -Force $validation | Out-Null
          $tar = Get-P4kxAssetName -Target $env:P4KX_TARGET -Version $env:VERSION -Package tar-gz
          .github/scripts/check-native-platform.ps1 -Target $env:P4KX_TARGET -ArchivePath (Join-Path $env:P4KX_PACKAGE_TASK "package/$tar") -BinaryDirectory "target/$env:P4KX_TARGET/release" -MetadataPath (Join-Path $validation 'build.json')
          @{target=$env:P4KX_TARGET; revision=$env:GITHUB_SHA; outcome=$env:ADAPTER_OUTCOME} | ConvertTo-Json | Set-Content (Join-Path $validation 'adapter.json') -Encoding utf8NoBOM
          Copy-Item (Join-Path $env:P4KX_PACKAGE_TASK 'tools/package-tools.json') (Join-Path $validation 'package-tools.json')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-build-${{ matrix.target }}
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/package/*
            ${{ env.P4KX_PACKAGE_TASK }}/fixture/*
            ${{ env.P4KX_PACKAGE_TASK }}/validation/*.json
          if-no-files-found: error

  verify:
    name: Execute native Linux packages (${{ matrix.target }})
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      P4KX_TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-build-${{ matrix.target }}
          path: artifacts/linux-build-${{ matrix.target }}
      - name: Create fresh native package verification folders
        run: |
          . .github/scripts/native-package-task.ps1
          $task = New-P4kxNativePackageTask -Directory $env:RUNNER_TEMP -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT -Target $env:P4KX_TARGET -Role consumer
          "P4KX_PACKAGE_TASK=$task" >> $env:GITHUB_ENV
      - uses: ./.github/actions/install-rust
        with:
          target: ${{ matrix.target }}
          nextest: "true"
      - name: Install native desktop and runtime dependencies
        run: .github/scripts/install-linux-package-dependencies.ps1
      - name: Execute each real package launcher, desktop frames and Documents portal grants
        run: |
          $base = "artifacts/linux-build-$env:P4KX_TARGET"
          & dbus-run-session -- xvfb-run --auto-servernum pwsh -NoProfile -File .github/scripts/check-linux-packages.ps1 -Target $env:P4KX_TARGET -Version $env:VERSION -AssetDirectory "$base/package" -FixtureDirectory "$base/fixture" -BuildMetadata "$base/validation/build.json" -AdapterEvidence "$base/validation/adapter.json" -OutputDirectory (Join-Path $env:P4KX_PACKAGE_TASK 'package-check')
          if ($LASTEXITCODE -ne 0) { throw 'Native installed Linux package execution failed.' }
          Copy-Item "$base/validation/package-tools.json" "$base/package/P4KX-$env:VERSION-$env:P4KX_TARGET-package-tools.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-package-logs-${{ matrix.target }}
          path: |
            ${{ env.P4KX_PACKAGE_TASK }}/package-check/**/*.log
            ${{ env.P4KX_PACKAGE_TASK }}/package-check/**/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: artifacts/linux-build-${{ matrix.target }}/package/*
          if-no-files-found: error
